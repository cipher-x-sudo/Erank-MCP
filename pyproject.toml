[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erank-mcp"
version = "0.1.0"
description = "MCP server for members.erank.com using cookie-session auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
erank-mcp = "erank_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erank_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/erank_mcp" = "erank_mcp"

[tool.hatch.build.targets.sdist]
include = ["src/erank_mcp", "catalog", "scripts", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
